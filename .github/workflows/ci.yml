name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('extension/manifest.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${manifest.version}` || pkg.version !== manifest.version) {
            throw new Error('Release tag, manifest version and package version must match.');
          }
          NODE
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-tabs-exporter-store-package
          path: |
            dist/chrome-tabs-exporter-*.zip
            dist/chrome-tabs-exporter-*.zip.sha256
          if-no-files-found: error
          overwrite: true
  release:
    name: Prepare release draft
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: chrome-tabs-exporter-store-package
          path: dist
      - name: Validate artifact and prepare release notes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          version = json.loads(Path('extension/manifest.json').read_text())['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise ValueError('Release tag does not match the extension version.')
          archive = Path(f'dist/chrome-tabs-exporter-{version}.zip')
          checksum = Path(f'{archive}.sha256')
          expected = f'{hashlib.sha256(archive.read_bytes()).hexdigest()}  {archive.name}\n'
          if checksum.read_text() != expected:
              raise ValueError('Downloaded extension ZIP does not match its SHA-256 checksum.')
          with zipfile.ZipFile(archive) as bundle:
              if json.loads(bundle.read('manifest.json'))['version'] != version:
                  raise ValueError('Packaged manifest version does not match the release.')
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(r'^## ' + re.escape(version) + r'(?:[ \t][^\n]*)?\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if section is None:
              raise ValueError('Missing changelog section for this version.')
          notes = section.group(1).strip() + f'\n\nDownload `{archive.name}` to install the extension. The adjacent `.sha256` file contains its SHA-256 checksum.\n\n下载 `{archive.name}`，解压后可通过 Chrome 开发者模式安装；同名 `.sha256` 文件用于校验下载内容。\n'
          Path('.local').mkdir(exist_ok=True)
          Path('.local/release-notes.md').write_text(notes)
          PY
      - name: Attach verified CI package to release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="dist/chrome-tabs-exporter-${RELEASE_TAG#v}.zip"
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft' > .local/release-is-draft.txt 2> .local/release-error.txt; then
            if [ "$(cat .local/release-is-draft.txt)" != 'true' ]; then
              echo 'This release is already public. Its assets will not be overwritten.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --repo "$GH_REPO" --clobber
          else
            if ! grep -Eq '(release not found|HTTP 404)' .local/release-error.txt; then
              cat .local/release-error.txt >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
              --repo "$GH_REPO" --draft --verify-tag \
              --title "Chrome Tabs Exporter ${RELEASE_TAG#v}" \
              --notes-file .local/release-notes.md
          fi
