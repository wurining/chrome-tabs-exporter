<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrome Tabs Exporter</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main class="about-app">
    <header class="brand"><img src="assets/icons/icon-48.png" width="48" height="48" alt=""><div><h1>Chrome Tabs Exporter</h1><p data-i18n="aboutSubtitle"></p></div></header>
    <section>
      <h2 data-i18n="aboutHeading"></h2><p data-i18n="aboutDescription"></p>
      <a href="https://github.com/wurining/chrome-tabs-exporter" target="_blank" rel="noopener noreferrer" data-i18n="sourceLink"></a>
      <span aria-hidden="true"> · </span><a href="https://github.com/wurining/chrome-tabs-exporter/issues" target="_blank" rel="noopener noreferrer" data-i18n="feedbackLink"></a>
    </section>
    <section id="support">
      <h2 data-i18n="supportHeading"></h2><p data-i18n="supportDescription"></p>
      <div class="support-cards">
        <article id="coffee-card" class="support-card coffee-card" hidden><h3>Buy Me a Coffee</h3><a id="coffee-link" class="coffee-button" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">💵</span><span data-i18n="coffeeLink"></span></a><img id="coffee-qr" alt="" hidden><p class="coffee-caption" data-i18n="scanCoffee"></p></article>
        <article id="wechat-card" class="support-card" hidden><h3 data-i18n="wechatLabel"></h3><img id="wechat-qr" alt=""><p data-i18n="scanWechat"></p></article>
        <article id="alipay-card" class="support-card" hidden><h3 data-i18n="alipayLabel"></h3><img id="alipay-qr" alt=""><p data-i18n="scanAlipay"></p></article>
      </div>
      <p id="support-empty" data-i18n="supportUnconfigured"></p>
    </section>
    <section id="privacy">
      <h2 data-i18n="privacyHeading"></h2><p data-i18n="privacyDate"></p>
      <p data-i18n="privacyData"></p><p data-i18n="privacyLocal"></p><p data-i18n="privacyStorage"></p><p data-i18n="privacySharing"></p><p data-i18n="privacySponsors"></p><p data-i18n="privacyExport"></p><p data-i18n="privacyLimitedUse"></p><p data-i18n="privacyContact"></p>
      <a href="https://github.com/wurining/chrome-tabs-exporter/issues" target="_blank" rel="noopener noreferrer" data-i18n="feedbackLink"></a>
    </section>
    <footer class="footer"><span data-i18n="licenseNote"></span></footer>
  </main>
  <script type="module" src="about.js"></script>
</body></html>
