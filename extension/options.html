<!doctype html>
<html lang="en" class="options-document">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chrome Tabs Exporter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options-page">
  <main class="options-app">
    <header class="options-header"><h1 data-i18n="settingsLink"></h1><p data-i18n="settingsDescription"></p></header>
    <section class="language-section">
      <label class="language-field"><span data-i18n="languageLabel"></span><select id="language"><option value="auto" data-i18n="browserLanguage"></option><option value="en">English</option><option value="zh_CN">简体中文</option></select></label>
      <p class="field-description" data-i18n="languageDescription"></p>
    </section>
    <footer class="options-footer"><p id="settings-status" role="status" aria-live="polite" data-i18n="settingsLocal"></p><a href="about.html" target="_blank" rel="noopener noreferrer" data-i18n="supportLink"></a></footer>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
